name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: 'Dry-run tag (artifacts only, no GitHub Release). Leave empty to skip.'
        required: false
        default: ''
      npm_publish_tag:
        description: 'npm だけ公開し直す既存のタグ（例: v0.1.30）。GitHub Release が既にあるタグを指定。空ならビルドだけ'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.target }}
    # npm だけの公開し直し（npm_publish_tag 指定）ではビルドしない
    if: ${{ inputs.npm_publish_tag == '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ccnest-windows-x64.exe
            src_bin: ccnest.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ccnest-macos-arm64
            src_bin: ccnest
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ccnest-macos-x64
            src_bin: ccnest
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ccnest-linux-x64
            src_bin: ccnest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.src_bin }}" "dist/${{ matrix.asset }}"

      - name: Compute SHA-256
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  checksums:
    name: Aggregate checksums.txt
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build checksums.txt
        run: |
          mkdir -p out
          find artifacts -name '*.sha256' -exec cat {} + | sort > out/checksums.txt
          cat out/checksums.txt

      - name: Upload checksums.txt to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/checksums.txt
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish ccnest-cli to npm
    needs: [build, checksums]
    # タグ push のリリース、または npm_publish_tag 指定の手動実行（既存タグの npm だけ公開し直す）
    if: >-
      ${{ !cancelled() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.checksums.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.npm_publish_tag != '')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing（OIDC）。NPM_TOKEN は使わない
    env:
      RELEASE_TAG: ${{ inputs.npm_publish_tag != '' && inputs.npm_publish_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing は npm 11.5.1 以上が必要
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Check GitHub Release assets exist
        # postinstall は releases/download/<tag>/ から exe と checksums.txt を落とすので、無いタグは公開しない
        run: |
          case "${RELEASE_TAG}" in v*) ;; *) echo "tag must start with v: ${RELEASE_TAG}"; exit 1;; esac
          for f in ccnest-windows-x64.exe checksums.txt; do
            curl -fsSL -r 0-0 -o /dev/null "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${f}" \
              || { echo "missing release asset: ${RELEASE_TAG}/${f}"; exit 1; }
          done

      - name: Sync npm package version with git tag
        working-directory: npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Setting ccnest-cli version to ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
